server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Long cache for hashed assets (Vite outputs /assets/<name>-<hash>.js)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # No cache for index.html and the PWA manifest so updates are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        # [fork] the SPA fallback ends HERE (try_files … /index.html), and add_header in a location does not inherit —
        # without these the HTML document had no clickjacking protection at all
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # Security headers for all other responses
    # Note: no restrictive Content-Security-Policy — the app opens WebSocket and
    # REST connections to arbitrary user-configured Home Assistant origins.
    location / {
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self'"; # [fork] (frame-ancestors only — connections stay open)
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # SPA fallback
        try_files $uri $uri/ /index.html;
    }
}
