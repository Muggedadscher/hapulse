<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Glas 5 · Desktop Inspector</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; overflow: hidden">
<dc-import name="Glas5Desktop" inspector="light" hint-size="1440px,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
