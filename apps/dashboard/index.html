<!DOCTYPE html>
<html lang="en" data-theme="aurora" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f6" />
    <meta name="description" content="Your Home Assistant, beautifully simplified." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- [fork] app icon set per selectable symbol (public/icons, gen-app-icons.mjs); the chosen symbol is

    <link rel="icon" type="image/svg+xml" href="/icons/pulse.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pulse-180.png" />
    <link rel="manifest" href="/icons/pulse.webmanifest" />

    <title>HAPulse</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
