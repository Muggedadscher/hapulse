server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # aktives Release (Symlink, atomar umgeschaltet von hapulse-build-deploy)
    root /var/www/hapulse-current;
    index index.html;

    # Web-App-Manifeste (public/icons/*.webmanifest) mit dem richtigen Typ ausliefern (Debian-mime.types kennt die Endung nicht)
    types { application/manifest+json webmanifest; }
    include /etc/nginx/mime.types;

    # Security-Header; add_header wird in locations mit eigenem add_header NICHT geerbt → dort das Snippet erneut einbinden
    include snippets/hapulse-security.conf;

    # Gehashte Assets aus dem Pool aller Releases (offene Tabs finden ihre Chunks auch nach einem Deploy), aggressiv cachen
    location /assets/ {
        root /var/www/hapulse-assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/hapulse-security.conf;
        try_files $uri =404;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nie cachen
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/hapulse-security.conf;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
